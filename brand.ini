; ============================================================================
;  9xHarness —— 品牌定制文件
;
;  改这里，然后重新编译，产品名、公司、版本、图标、安装目录、光盘卷标
;  会一起变。编译时用 -Brand 指定别的文件即可保留多套品牌。
;
;      powershell -File build.ps1 -Target release
;      powershell -File build.ps1 -Target release -Brand brand-demo.ini
;
;  注意：
;   * 所有值都不要加引号。
;   * version_tuple 必须是 4 个用逗号分隔的数字。
;   * icon 路径相对仓库根目录；留空表示用该程序自带的默认图标。
; ============================================================================

[product]
; 完整产品名（窗口标题、关于框、激活框都用这个）
name            = 9xHarness
name_en         = 9xHarness

; 短名（菜单、对话框标题、开始菜单项）
short           = 9xHarness
short_en        = 9xHarness

; 中文别称（系统提示词里用来描述自己）
nickname        = 9x 工作台
nickname_en     = 9x Harness

; 一句话说明（关于框、版本信息里的 FileDescription）
description     = 老 Windows 上的桌面智能助手
description_en  = Desktop assistant for legacy Windows

; 版本
version         = 3.00.2003
version_tuple   = 3,0,0,2003

[company]
name            = Axiom Software
name_en         = Axiom Software
copyright       = Copyright (C) 1993-2003 Axiom Software
website         = www.axiomsoft.example

[layout]
; 可执行文件名（不含 .exe）。改名后安装程序、卸载、快捷方式都会跟着变。
exe             = 9XHARNESS

; 配置文件与注册表位置
ini_name        = 9XHARNESS.INI
reg_root        = Software\9xHarness\9xHarness

; Program Files 下的安装子目录 / 开始菜单组
install_subdir  = 9xHarness
menu_group      = 9xHarness

; 发行文件名前缀（ISO / ZIP / 单文件安装器都用它）
; 例如 9XHARNESS 会生成 9XHARNESS-DISK1-INSTALL.iso
slug            = 9XHARNESS

; 光盘卷标（ISO9660，最多 32 字符，建议纯大写）
iso_label       = 9XHARNESS
iso_label_tools = 9XHARNESSTOOLS

[icons]
agent           = src\agent\res\agent.ico
setup           = src\setup\res\setup.ico
keygen          = src\keygen\res\keygen.ico
uninst          = src\tools\res\uninst.ico

[versioninfo]
; 版本信息资源的语言块与代码页（中文 = 080404b0 / 1200）
lang            = 080404b0
codepage        = 1200
comments        = Built-in SSL/TLS 1.2 client for legacy Windows
